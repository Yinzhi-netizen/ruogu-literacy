<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2c4a7c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="星河书旅" />
    <title>若谷星河书旅</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      :root {
        --primary: #7a8b5e;
        --primary-deep: #4a5538;
        --accent: #b8453a;
      }
      .page-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      .page-bg::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(244, 242, 237, .62);
      }
    </style>
  </head>
  <body>
    <div class="page-bg" style="background-image: url('./assets/backgrounds/06_cloud_characters_mobile.jpg');"></div>
    <main class="landing-shell">
      <div class="landing-hero">
        <span class="landing-number">2026</span>
        <h1 class="landing-title">若谷星河书旅</h1>
        <p class="landing-tagline">旷兮其若谷</p>
        <p class="landing-sub">一、二年级识字闯关 · 小人对战能量站</p>
      </div>

      <section class="module-grid grade-grid">
        <a class="module-card grade-card" href="./game.html?grade=一年级">
          <div class="module-icon"><img src="./assets/icons/icon_read.png" alt=""></div>
          <div class="module-card-body">
            <h3>一年级</h3>
            <p>上册 · 下册<br>认读 / 听写 / 阅读 / 课文测试</p>
          </div>
        </a>
        <a class="module-card grade-card" href="./game.html?grade=二年级">
          <div class="module-icon"><img src="./assets/icons/icon_write.png" alt=""></div>
          <div class="module-card-body">
            <h3>二年级</h3>
            <p>上册（本学期）<br>认读 / 听写 / 阅读 / 课文测试</p>
          </div>
        </a>
      </section>

      <div class="landing-cta">
        <a class="landing-secondary" href="./若谷冒险游戏/index.html">⚔️ 小人对战（用星星兑换）</a>
      </div>
    </main>
  </body>
</html>
